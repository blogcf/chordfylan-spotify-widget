<div id="cfIndoChart" data-url="https://blogcf.github.io/chordfylan-spotify-widget/chart.json">
  <header><strong>TOP 10 CHORD ARTIS INDONESIA</strong><small>Last.fm × MusicBrainz × Chordfylan</small></header>
  <p class="cf-message">Memuat tangga lagu...</p>
  <ol class="cf-songs"></ol>
  <footer><span class="cf-updated"></span><a href="https://www.last.fm" target="_blank" rel="noopener noreferrer">Sumber ranking: Last.fm</a></footer>
</div>
<style>
#cfIndoChart{font:14px Arial,sans-serif;border:1px solid #ddd;border-radius:12px;overflow:hidden;background:#fff;color:#222}
#cfIndoChart header{background:#2d4fc1;color:#fff;padding:15px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
#cfIndoChart header small{font-size:11px;opacity:.85}
#cfIndoChart .cf-message{padding:14px;color:#777;margin:0}
#cfIndoChart .cf-songs{list-style:none;padding:0;margin:0}
#cfIndoChart .cf-songs li{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid #eee}
#cfIndoChart .cf-num{font-size:18px;font-weight:bold;color:#2d4fc1;min-width:28px}
#cfIndoChart .cf-song{min-width:0;flex:1}
#cfIndoChart .cf-song a{font-weight:bold;color:#222;text-decoration:none}
#cfIndoChart .cf-song a:hover{color:#2d4fc1}
#cfIndoChart .cf-song small{display:block;color:#777;margin-top:3px}
#cfIndoChart footer{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;padding:12px 14px;color:#777;font-size:11px}
#cfIndoChart footer a{color:#2d4fc1;text-decoration:none}
</style>
<script>
(function(){
  var root=document.getElementById('cfIndoChart');if(!root)return;
  var message=root.querySelector('.cf-message'),list=root.querySelector('.cf-songs');
  fetch(root.getAttribute('data-url'),{cache:'no-cache'})
    .then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json()})
    .then(function(data){
      if(!Array.isArray(data.matches))throw Error('Format chart.json tidak valid');
      list.replaceChildren();
      data.matches.slice(0,10).forEach(function(song,index){
        if(!/^https:\/\//.test(song.url||''))return;
        var li=document.createElement('li'),num=document.createElement('span'),box=document.createElement('div'),a=document.createElement('a'),artist=document.createElement('small');
        num.className='cf-num';num.textContent=String(index+1).padStart(2,'0');
        box.className='cf-song';a.href=song.url;a.textContent=song.articleTitle||song.title;
        artist.textContent=(song.artist||'')+' · Posisi Last.fm #'+song.rank;
        box.append(a,artist);li.append(num,box);list.append(li);
      });
      if(list.children.length){message.hidden=true}else{message.textContent='Belum ada artikel yang cocok dengan artis Indonesia terverifikasi.'}
      if(data.updatedAt){root.querySelector('.cf-updated').textContent='Diperbarui: '+new Date(data.updatedAt).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}
    }).catch(function(err){message.textContent='Gagal memuat chart: '+err.message});
})();
</script>
