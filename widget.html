<div id="cfSpotifyTop10" data-url="GANTI_DENGAN_URL_GITHUB_PAGES/chart.json">
  <div class="cf-head"><strong>♫ TOP CHORD PLAYLIST</strong><small>Spotify × Chordfylan</small></div>
  <p class="cf-status">Memuat playlist...</p>
  <ol class="cf-list"></ol>
  <div class="cf-footer"><span class="cf-date"></span><a class="cf-source" href="https://open.spotify.com/" target="_blank" rel="noopener noreferrer">Lihat playlist Spotify ↗</a></div>
</div>
<style>
#cfSpotifyTop10{font-family:Arial,sans-serif;background:#fff;border:1px solid #ddd;border-radius:12px;overflow:hidden;color:#222}
#cfSpotifyTop10 .cf-head{background:#191919;color:white;padding:15px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
#cfSpotifyTop10 .cf-head small{color:#1db954;font-size:11px}
#cfSpotifyTop10 .cf-status{padding:14px;font-size:12px;color:#777;margin:0}
#cfSpotifyTop10 .cf-list{margin:0;padding:0;list-style:none}
#cfSpotifyTop10 .cf-list li{border-bottom:1px solid #eee;padding:11px 14px;display:flex;gap:12px;align-items:center}
#cfSpotifyTop10 .cf-rank{font-size:17px;font-weight:bold;color:#1db954;min-width:28px}
#cfSpotifyTop10 .cf-item{min-width:0;flex:1}
#cfSpotifyTop10 .cf-item a{display:block;font-size:13px;font-weight:bold;color:#222;text-decoration:none;line-height:1.4}
#cfSpotifyTop10 .cf-item a:hover{color:#12813b}
#cfSpotifyTop10 .cf-item small{display:block;color:#777;margin-top:3px;font-size:11px}
#cfSpotifyTop10 .cf-footer{padding:11px 14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:10px;color:#777}
#cfSpotifyTop10 .cf-footer a{color:#12813b;text-decoration:none}
</style>
<script>
(function(){
  var root=document.getElementById('cfSpotifyTop10');
  if(!root)return;
  var url=root.getAttribute('data-url');
  var status=root.querySelector('.cf-status'),list=root.querySelector('.cf-list');
  if(!/^https:\/\//i.test(url)){status.textContent='Konfigurasi JSON belum diisi.';return;}
  fetch(url,{cache:'no-cache'}).then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(function(data){
    if(!Array.isArray(data.matches))throw Error('Format data tidak valid');
    list.replaceChildren();
    data.matches.slice(0,10).forEach(function(m){
      if(!/^https:\/\//i.test(m.url||''))return;
      var li=document.createElement('li'),rank=document.createElement('span'),box=document.createElement('div'),a=document.createElement('a'),artist=document.createElement('small');
      rank.className='cf-rank';rank.textContent=String(m.rank).padStart(2,'0');
      box.className='cf-item';a.href=m.url;a.textContent=m.articleTitle||m.title;artist.textContent=m.artist||'';
      box.append(a,artist);li.append(rank,box);list.append(li);
    });
    status.style.display=list.children.length?'none':'block';
    if(!list.children.length)status.textContent='Belum ada artikel chord yang cocok.';
    if(data.updatedAt&&!isNaN(Date.parse(data.updatedAt)))root.querySelector('.cf-date').textContent='Diperbarui '+new Date(data.updatedAt).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
    if(/^https:\/\/open\.spotify\.com\/playlist\/[A-Za-z0-9]+$/.test(data.playlistUrl||''))root.querySelector('.cf-source').href=data.playlistUrl;
  }).catch(function(err){status.textContent='Gagal memuat widget: '+err.message;});
})();
</script>
