
name: Sync Last.fm Chordfylan

on:
  schedule:
    - cron: '15 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lastfm-chordfylan-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test matching
        run: npm test

      - name: Sync Last.fm and Blogger
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          BLOG_URL: https://www.chordfylan.com
        run: npm run sync

      - name: Commit JSON if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/chart.json docs/match-report.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan"
          else
            git commit -m "chore: sync Last.fm chord widget"
            git push
          fi
