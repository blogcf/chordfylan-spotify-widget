name: Sync Indonesian Artist Chord Chart
on:
  schedule:
    - cron: '15 23 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chordfylan-chart
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run tests
        run: npm test
      - name: Fetch charts and verify artist origins
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          MUSICBRAINZ_USER_AGENT: ${{ vars.MUSICBRAINZ_USER_AGENT }}
          BLOG_URL: https://www.chordfylan.com
        run: npm run sync
      - name: Commit generated JSON and country cache
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/chart.json docs/match-report.json data/artist-country-cache.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: sync Indonesian artist chart'
            git push
          fi
